name: Validate completed shared-state wiring
on:
  push:
    branches: [refactor/shared-bridge-core]
    paths: [.github/workflows/shared-core-review.yml]
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'guanglinhuang99/lark-coding-agent-bridge' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.apply.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - id: apply
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/bot/channel.ts')
          s = p.read_text()
          for old, new in [
              ('const identity: BridgeIdentity =', 'const bridgeIdentity: BridgeIdentity ='),
              ('      }, identity)\n    : undefined;', '      }, bridgeIdentity)\n    : undefined;'),
              ('new InboundCoordinator(taskLedger, identity)', 'new InboundCoordinator(taskLedger, bridgeIdentity)'),
          ]:
              assert s.count(old) == 1, old
              s = s.replace(old, new, 1)
          p.write_text(s)
          p = Path('src/wecom/cli.ts')
          s = p.read_text()
          old = "    } catch (err) {\n      const message = err instanceof Error ? err.message : String(err);\n      state = reduce(state, {"
          new = """    } catch (err) {
                if (state.terminal === 'done') {
                  // Execution is complete; delivery/persistence failure must never
                  // invite an automatic rerun of side-effectful work.
                  log.fail('wecom-delivery', err, { step: 'after-completion' });
                  reportMetric('wecom_delivery_failures', 1, { step: 'after-completion' });
                  if (durableTaskId) await taskStore.markDone(durableTaskId).catch(() => {});
                  await replyOnce(frame, '任务已完成，结果发送未完成', [
                    '执行结果已产生；请检查连接或本地结果，不要直接重复执行写操作。',
                  ]).catch(() => {});
                  return;
                }
                const message = err instanceof Error ? err.message : String(err);
                state = reduce(state, {"""
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          rm .github/workflows/shared-core-review.yml
          git diff --check
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: separate bridge identity and preserve completed execution receipts'
          git push origin HEAD:refs/heads/refactor/shared-bridge-core
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  validate:
    needs: apply
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.commit }}
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build:web
      - name: Typecheck
        if: always()
        run: pnpm typecheck
      - name: Full regression suite
        if: always()
        shell: bash
        run: |
          set +e
          pnpm test > "$RUNNER_TEMP/shared-test.log" 2>&1
          result=$?
          tail -n 180 "$RUNNER_TEMP/shared-test.log"
          exit "$result"
      - name: Build
        if: always()
        run: pnpm build
