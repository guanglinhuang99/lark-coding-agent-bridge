name: WeCom Reliability Wiring

on:
  push:
    branches:
      - feat/wecom-reliability-p0-p1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/wecom-reliability-p0-p1
          fetch-depth: 0

      - name: Apply reliability wiring
        run: node scripts/apply-wecom-reliability-patch.mjs

      - name: Commit wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat(wecom): wire reliability control plane"
          git push origin HEAD:feat/wecom-reliability-p0-p1
