name: Finish and validate shared bridge state
on:
  push:
    branches: [refactor/shared-bridge-core]
    paths: [.github/workflows/shared-core-finish.yml]
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'guanglinhuang99/lark-coding-agent-bridge' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.apply.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - id: apply
        name: Apply guarded code edits on feature branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 360ee6f76ab6b14a3485d9019e5008224aa053b3 HEAD -- src/wecom/cli.ts src/bot/channel.ts src/bot/run-flow.ts src/bot/pending-queue.ts src/runtime/supervisor.ts src/bridge/task-ledger.ts src/bridge/reliability.ts
          python .github/finish-shared-core.py
          python .github/finish-shared-core-extra.py
          python .github/finish-shared-core-artifacts.py
          node .github/finish-shared-core-ast.cjs
          rm .github/finish-shared-core.py .github/finish-shared-core-extra.py .github/finish-shared-core-artifacts.py .github/finish-shared-core-ast.cjs .github/workflows/shared-core-finish.yml
          git diff --check
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'refactor: wire shared conversation state and durable inbound lifecycle'
          git push origin HEAD:refs/heads/refactor/shared-bridge-core
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  validate:
    needs: apply
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.commit }}
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prepare generated UI
        run: pnpm build:web
      - name: Typecheck
        if: always()
        run: pnpm typecheck
      - name: Full regression suite
        if: always()
        shell: bash
        run: |
          set +e
          pnpm test > "$RUNNER_TEMP/shared-test.log" 2>&1
          result=$?
          tail -n 160 "$RUNNER_TEMP/shared-test.log"
          exit "$result"
      - name: Build
        if: always()
        run: pnpm build
      - name: Validate final repository diff
        if: always()
        run: git diff --check
